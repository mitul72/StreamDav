plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '4.1.1'
}

group = 'com.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    // Declared here (not only via options.release) so IDE imports such as VS Code / Buildship see the language level.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

// JavaFX and SQLite load native libraries, and the app calls libmpv through the FFM API. mpv draws video straight
// into the window, whose native handle only JavaFX's internal glass toolkit knows.
def nativeAccessArgs = ['--enable-native-access=javafx.graphics,javafx.media,org.xerial.sqlitejdbc,com.example.streamdav',
                        '--add-exports=javafx.graphics/com.sun.glass.ui=com.example.streamdav']

application {
    mainModule = 'com.example.streamdav'
    mainClass = 'com.example.streamdav.StreamDavApplication'
    applicationDefaultJvmArgs = nativeAccessArgs
}

javafx {
    version = '25.0.4'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.media']
}

dependencies {
    implementation 'org.apache.logging.log4j:log4j-core:2.26.1'
    implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Release builds carry a TMDB key so users needn't get their own. It comes from the build environment
// (-PtmdbApiKey=... or TMDB_API_KEY, a CI secret for releases) and only ever lands in build/, never in the source.
def tmdbApiKey = providers.gradleProperty('tmdbApiKey').orElse(providers.environmentVariable('TMDB_API_KEY')).orElse('')
def generateApiKeys = tasks.register('generateApiKeys') {
    def output = layout.buildDirectory.dir('generated/api-keys')
    def key = tmdbApiKey
    inputs.property('tmdbApiKey', key)
    outputs.dir(output)
    doLast {
        def file = output.get().file('com/example/streamdav/metadata/api-keys.properties').asFile
        file.parentFile.mkdirs()
        file.text = key.get().isBlank() ? '' : "tmdb=${key.get().strip()}\n"
    }
}
sourceSets.main.resources.srcDir(generateApiKeys)

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

jlink {
    imageZip = layout.buildDirectory.file("distributions/streamdav-${javafx.platform.classifier}.zip")
    options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'streamdav'
        jvmArgs = nativeAccessArgs
    }
}

jlinkZip {
    group = 'distribution'
}
